[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-rule-converter"
version = "4.0.1"
description = "Loss-aware Snort and Suricata rule conversion toolkit"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Fusion Technology Strategies" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]

[project.scripts]
ids-rule-converter = "snort_suricata_rule_converter:main"

[project.urls]
Repository = "https://github.com/fusiontechstrategies/IDS-Rule-Converter"
Issues = "https://github.com/fusiontechstrategies/IDS-Rule-Converter/issues"

[tool.setuptools]
py-modules = ["snort_suricata_rule_converter"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".local-reference"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "S", "SIM", "UP"]
ignore = ["E501", "S310"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
