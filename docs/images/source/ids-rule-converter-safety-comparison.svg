<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" role="img" aria-labelledby="title description">
  <title id="title">IDS Rule Converter strict and reviewed partial result comparison</title>
  <desc id="description">Synthetic two-rule input showing that strict mode writes no converted ruleset when one rule is unsafe, while reviewed partial mode keeps the accepted rule, rejected source rule, and JSON report together and still exits with code 2.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091525"/>
      <stop offset="0.55" stop-color="#10243a"/>
      <stop offset="1" stop-color="#0b1728"/>
    </linearGradient>
    <linearGradient id="strictPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241d2e"/>
      <stop offset="1" stop-color="#171a28"/>
    </linearGradient>
    <linearGradient id="partialPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102f36"/>
      <stop offset="1" stop-color="#111e2b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020712" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="1400" fill="url(#background)"/>
  <circle cx="1110" cy="-80" r="320" fill="#156b84" opacity="0.13"/>
  <circle cx="70" cy="1340" r="320" fill="#674151" opacity="0.10"/>

  <text x="70" y="70" fill="#78d8ef" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="3">IDS RULE CONVERTER</text>
  <text x="70" y="124" fill="#f4f8fb" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="750">Refuse uncertainty.</text>
  <text x="70" y="172" fill="#f4f8fb" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="750">Preserve the evidence.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="215" width="1060" height="168" rx="20" fill="#142b43" stroke="#31506d" stroke-width="2"/>
  </g>
  <text x="100" y="253" fill="#78d8ef" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.5">SYNTHETIC INPUT | 2 SNORT 3 RULES</text>
  <rect x="100" y="274" width="1000" height="42" rx="10" fill="#0d1d2d"/>
  <circle cx="127" cy="295" r="8" fill="#40c98b"/>
  <text x="150" y="302" fill="#f4f8fb" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">SID 9000101</text>
  <text x="1070" y="302" text-anchor="end" fill="#aebed0" font-family="Segoe UI, Arial, sans-serif" font-size="18">/health mapping verified</text>
  <rect x="100" y="326" width="1000" height="42" rx="10" fill="#0d1d2d"/>
  <circle cx="127" cy="347" r="8" fill="#ff7c83"/>
  <text x="150" y="354" fill="#f4f8fb" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">SID 9000102</text>
  <text x="1070" y="354" text-anchor="end" fill="#ffb2b6" font-family="Segoe UI, Arial, sans-serif" font-size="18">UNSUPPORTED_TARGET_ACTION</text>

  <path d="M600 383 L600 412" stroke="#ff7c83" stroke-width="4"/>
  <path d="M589 403 L600 416 L611 403" fill="none" stroke="#ff7c83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="70" y="425" width="1060" height="362" rx="22" fill="url(#strictPanel)" stroke="#7d4c60" stroke-width="2"/>
  </g>
  <rect x="100" y="454" width="116" height="34" rx="17" fill="#6f3246"/>
  <text x="158" y="477" text-anchor="middle" fill="#fff2f4" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1">DEFAULT</text>
  <text x="100" y="538" fill="#f4f8fb" font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="750">Strict conversion stops</text>
  <text x="100" y="572" fill="#ffb2b6" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">One unsafe mapping blocks the complete ruleset</text>
  <rect x="100" y="603" width="1000" height="48" rx="11" fill="#101724"/>
  <text x="125" y="634" fill="#aebed0" font-family="Segoe UI, Arial, sans-serif" font-size="19">Process result</text>
  <text x="1070" y="634" text-anchor="end" fill="#ffb2b6" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">EXIT CODE 2</text>
  <rect x="100" y="661" width="1000" height="48" rx="11" fill="#101724"/>
  <text x="125" y="692" fill="#aebed0" font-family="Segoe UI, Arial, sans-serif" font-size="19">Converted ruleset</text>
  <text x="1070" y="692" text-anchor="end" fill="#ffb2b6" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">NOT WRITTEN</text>
  <rect x="100" y="719" width="1000" height="48" rx="11" fill="#101724"/>
  <text x="125" y="750" fill="#aebed0" font-family="Segoe UI, Arial, sans-serif" font-size="19">Finding and reason</text>
  <text x="1070" y="750" text-anchor="end" fill="#f4f8fb" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">SHOWN IN CONSOLE</text>

  <rect x="388" y="812" width="424" height="38" rx="19" fill="#0b1a2a" stroke="#287b76"/>
  <text x="600" y="837" text-anchor="middle" fill="#7ee9ca" font-family="Consolas, monospace" font-size="16" font-weight="700">OR EXPLICIT --allow-partial</text>
  <path d="M600 850 L600 879" stroke="#4ed8b1" stroke-width="4"/>
  <path d="M589 870 L600 883 L611 870" fill="none" stroke="#4ed8b1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="70" y="892" width="1060" height="405" rx="22" fill="url(#partialPanel)" stroke="#287b76" stroke-width="2"/>
  </g>
  <rect x="100" y="921" width="178" height="34" rx="17" fill="#17685f"/>
  <text x="189" y="944" text-anchor="middle" fill="#eafff9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1">EXPLICIT OPT-IN</text>
  <text x="100" y="1005" fill="#f4f8fb" font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="750">Reviewed partial export separates evidence</text>
  <text x="100" y="1039" fill="#7ee9ca" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Incomplete output stays unmistakably incomplete</text>
  <rect x="100" y="1070" width="1000" height="46" rx="11" fill="#0c1a26"/>
  <text x="125" y="1100" fill="#aebed0" font-family="Segoe UI, Arial, sans-serif" font-size="19">Process result</text>
  <text x="1070" y="1100" text-anchor="end" fill="#7ee9ca" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">EXIT CODE 2</text>

  <rect x="100" y="1128" width="1000" height="48" rx="11" fill="#0c1a26" stroke="#24645e"/>
  <circle cx="127" cy="1152" r="8" fill="#40c98b"/>
  <text x="150" y="1159" fill="#f4f8fb" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">accepted.rules</text>
  <text x="1070" y="1159" text-anchor="end" fill="#7ee9ca" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">1 VERIFIED RULE</text>
  <rect x="100" y="1186" width="1000" height="48" rx="11" fill="#0c1a26" stroke="#744154"/>
  <circle cx="127" cy="1210" r="8" fill="#ff7c83"/>
  <text x="150" y="1217" fill="#f4f8fb" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">rejected.rules</text>
  <text x="1070" y="1217" text-anchor="end" fill="#ffb2b6" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="750">1 ORIGINAL SOURCE RULE</text>
  <rect x="100" y="1244" width="1000" height="33" rx="11" fill="#0c1a26" stroke="#31506d"/>
  <circle cx="127" cy="1260" r="8" fill="#78d8ef"/>
  <text x="150" y="1267" fill="#f4f8fb" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">report.json</text>
  <text x="1070" y="1267" text-anchor="end" fill="#78d8ef" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="750">TARGET INCOMPATIBILITY RECORDED</text>

  <rect x="70" y="1330" width="1060" height="44" rx="13" fill="#0a1320" stroke="#31506d"/>
  <text x="95" y="1358" fill="#78d8ef" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.2">SYNTHETIC TEST DATA</text>
  <text x="311" y="1358" fill="#899db3" font-family="Segoe UI, Arial, sans-serif" font-size="15">|</text>
  <text x="334" y="1358" fill="#d8e1eb" font-family="Segoe UI, Arial, sans-serif" font-size="15">Native target validation is still required before deployment.</text>
  <text x="1105" y="1358" text-anchor="end" fill="#899db3" font-family="Segoe UI, Arial, sans-serif" font-size="13">v4.0.1 evidence</text>
</svg>
