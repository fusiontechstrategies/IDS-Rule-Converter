name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "47 10 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Python dependency and security audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned development checks
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Audit pinned development dependencies
        run: python -m pip_audit -r requirements-dev.txt
      - name: Scan Python source with Bandit
        run: python -m bandit -q -r snort_suricata_rule_converter.py

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: python
          queries: security-extended,security-and-quality
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:python
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: codeql-results
      - name: Preserve CodeQL results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-results-${{ github.sha }}
          path: codeql-results/
          if-no-files-found: error
          retention-days: 90

  semgrep:
    name: Semgrep CE security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796 # v1.175.0
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan for security and correctness defects
        id: semgrep-scan
        continue-on-error: true
        run: semgrep scan --config auto --error --jobs 2 --max-memory 4000 --timeout 10 --sarif-output semgrep-results.sarif .
      - name: Preserve Semgrep results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-results-${{ github.sha }}
          path: semgrep-results.sarif
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce Semgrep result
        if: steps.semgrep-scan.outcome == 'failure'
        run: exit 1

  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
          "$install_dir/gitleaks" version
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Detect committed secrets across every reachable revision
        id: gitleaks-scan
        continue-on-error: true
        run: >-
          gitleaks git --redact=100 --no-banner --timeout 600
          --report-format sarif --report-path gitleaks-results.sarif
          --log-opts="--all" .
      - name: Preserve Gitleaks results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-results-${{ github.sha }}
          path: gitleaks-results.sarif
          if-no-files-found: error
          retention-days: 90
      - name: Enforce Gitleaks result
        if: steps.gitleaks-scan.outcome == 'failure'
        run: exit 1

  filesystem-scan:
    name: Source and configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan source, configuration, secrets, and dependency files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: 1
          format: table

  required:
    name: Security checks
    if: always()
    needs: [dependency-audit, codeql, semgrep, secret-scan, filesystem-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm all security jobs succeeded
        env:
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
          CODEQL: ${{ needs.codeql.result }}
          SEMGREP: ${{ needs.semgrep.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          FILESYSTEM_SCAN: ${{ needs.filesystem-scan.result }}
        run: |
          test "$DEPENDENCY_AUDIT" = "success"
          test "$CODEQL" = "success"
          test "$SEMGREP" = "success"
          test "$SECRET_SCAN" = "success"
          test "$FILESYSTEM_SCAN" = "success"
