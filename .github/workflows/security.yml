name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "47 10 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Python dependency and security audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned development checks
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Audit pinned development dependencies
        run: python -m pip_audit -r requirements-dev.txt
      - name: Scan Python source with Bandit
        run: python -m bandit -q -r snort_suricata_rule_converter.py scripts

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: python
          queries: security-extended,security-and-quality
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:python
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: codeql-results
      - name: Preserve CodeQL results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-results-${{ github.sha }}
          path: codeql-results/
          if-no-files-found: error
          retention-days: 90

  security:
    name: Security
    permissions:
      contents: read
      security-events: write
    uses: fusiontechstrategies/FusionTechStrategies/.github/workflows/reusable-security.yml@f64c8eb98fa6c907e013d158089ea6ab38e91ad7

  required:
    name: Security checks
    if: always()
    needs: [dependency-audit, codeql, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm all security jobs succeeded
        env:
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
          CODEQL: ${{ needs.codeql.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          test "$DEPENDENCY_AUDIT" = "success"
          test "$CODEQL" = "success"
          test "$SECURITY" = "success"
