name: Publish package to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public GitHub release tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify public release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    outputs:
      manifest: ${{ steps.assets.outputs.manifest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      source-commit: ${{ steps.identity.outputs.source-commit }}
      release-id: ${{ steps.identity.outputs.release-id }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Check out workflow-reviewed verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: trusted-verifier

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate release identity and asset set
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          test "$(python -I -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "$version"
          commit="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$commit" origin/main
          test "$(gh api "repos/$GH_REPO/commits/$commit" --jq '.commit.verification.verified')" = true
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = false
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease')" = false
          echo "source-commit=$commit" >> "$GITHUB_OUTPUT"
          echo "release-id=$(gh release view "$RELEASE_TAG" --json databaseId --jq '.databaseId')" >> "$GITHUB_OUTPUT"
          expected="$(printf '%s\n' \
            "IDS-Rule-Converter-v${version}.py" \
            "IDS-Rule-Converter-v${version}.zip" \
            "ids_rule_converter-${version}-py3-none-any.whl" \
            "ids_rule_converter-${version}.tar.gz" \
            "IDS-Rule-Converter-v${version}.spdx.json" \
            'SHA256SUMS.txt' 'release-evidence.json' | sort)"
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          test "$expected" = "$actual"

      - name: Download and verify public release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets dist
          gh release download "$RELEASE_TAG" --pattern '*' --dir release-assets
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          echo "manifest=$(python -I trusted-verifier/scripts/verify_release_integrity.py assets release-assets -)" >> "$GITHUB_OUTPUT"
          cp release-assets/*.whl release-assets/*.tar.gz dist/
          python -I trusted-verifier/scripts/verify_distribution.py dist --source-root "$PWD" --version "${RELEASE_TAG#v}"
          python -I - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path('release-assets')
          evidence = json.loads((root / 'release-evidence.json').read_text(encoding='utf-8'))
          tag = os.environ['RELEASE_TAG']
          version = tag[1:]
          assert evidence['version'] == version
          assert evidence['source_commit'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert set(evidence['expected_release_assets']) == {p.name for p in root.iterdir()}
          for artifact in evidence['artifacts']:
              path = root / artifact['name']
              assert path.stat().st_size == artifact['bytes']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == artifact['sha256']
          source = root / f'IDS-Rule-Converter-v{version}.py'
          assert source.read_bytes() == Path('snort_suricata_rule_converter.py').read_bytes()
          PY

      - name: Verify GitHub provenance attestations
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          for asset in release-assets/*; do
            gh attestation verify "$asset" \
              --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-digest "$commit" \
              --source-ref "refs/tags/$RELEASE_TAG"
          done

      - name: Bind final publication bytes to attested originals
        env:
          EXPECTED_MANIFEST: ${{ steps.assets.outputs.manifest }}
        run: |
          python -I trusted-verifier/scripts/verify_release_integrity.py assets release-assets "$EXPECTED_MANIFEST"
          python -I trusted-verifier/scripts/verify_release_integrity.py distributions dist "$EXPECTED_MANIFEST"

      - name: Store verified distributions
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified distributions to PyPI
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ids-rule-converter
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          merge-multiple: true
          path: dist

      - name: Reverify immutable transfer without running tagged code
        env:
          EXPECTED_MANIFEST: ${{ needs.verify.outputs.manifest }}
        run: |
          python -I - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          expected = {name: digest for name, digest in json.loads(os.environ["EXPECTED_MANIFEST"]).items() if name.endswith((".whl", ".tar.gz"))}
          root = Path("dist")
          assert len(expected) == 2 and {path.name for path in root.iterdir()} == set(expected)
          for name, digest in expected.items():
              path = root / name
              assert path.is_file() and not path.is_symlink()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest
          PY

      - name: Recheck publication authorization after environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERIFIED_COMMIT: ${{ needs.verify.outputs.source-commit }}
          VERIFIED_RELEASE_ID: ${{ needs.verify.outputs.release-id }}
        run: |
          python -I - <<'PY'
          import json
          import os
          import re
          import subprocess
          from urllib.parse import quote

          repo = os.environ["GH_REPO"]
          tag = os.environ["RELEASE_TAG"]
          commit = os.environ["VERIFIED_COMMIT"]
          assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag)
          assert re.fullmatch(r"[0-9a-f]{40}", commit)
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/{path}"], text=True))
          target = api(f"git/ref/tags/{quote(tag, safe='')}")["object"]
          for _ in range(8):
              if target["type"] == "commit":
                  break
              assert target["type"] == "tag"
              target = api(f"git/tags/{target['sha']}")["object"]
          assert target["type"] == "commit" and target["sha"] == commit
          assert api(f"commits/{commit}")["commit"]["verification"]["verified"] is True
          assert api(f"compare/{commit}...main")["status"] in ("identical", "ahead")
          release = api(f"releases/tags/{quote(tag, safe='')}")
          assert str(release["id"]) == os.environ["VERIFIED_RELEASE_ID"]
          assert release["tag_name"] == tag and release["draft"] is False and release["prerelease"] is False
          PY

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          attestations: true
          print-hash: true
