name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Build and draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve and validate release identity
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must contain a stable semantic version" >&2
            exit 1
          fi
          release_commit="$(git rev-list --max-count=1 "$GITHUB_REF_NAME")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$release_commit" origin/main
          verified="$(gh api "repos/$GITHUB_REPOSITORY/commits/$release_commit" --jq '.commit.verification.verified')"
          test "$verified" = "true"
          test -f ".github/release-notes/$GITHUB_REF_NAME.md"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release already exists for $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Build exact release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          set -euo pipefail
          python scripts/prepare_release.py \
            --version "$RELEASE_VERSION" \
            --source-commit "$RELEASE_COMMIT" \
            --output-dir dist
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 5

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --target "$RELEASE_COMMIT" \
            --title "IDS Rule Converter $RELEASE_VERSION" \
            --notes-file ".github/release-notes/$GITHUB_REF_NAME.md" \
            "dist/IDS-Rule-Converter-v$RELEASE_VERSION.py" \
            "dist/IDS-Rule-Converter-v$RELEASE_VERSION.zip" \
            "dist/IDS-Rule-Converter-v$RELEASE_VERSION.spdx.json" \
            "dist/SHA256SUMS.txt" \
            "dist/release-evidence.json"

      - name: Verify exact draft state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets > release-state.json
          python - "$RELEASE_VERSION" <<'PY'
          import json
          import sys

          version = sys.argv[1]
          state = json.load(open("release-state.json", encoding="utf-8"))
          expected = {
              f"IDS-Rule-Converter-v{version}.py",
              f"IDS-Rule-Converter-v{version}.zip",
              f"IDS-Rule-Converter-v{version}.spdx.json",
              "SHA256SUMS.txt",
              "release-evidence.json",
          }
          actual = {asset["name"] for asset in state["assets"]}
          if state["isDraft"] is not True or state["isPrerelease"] is not False:
              raise SystemExit("Release must remain a non-prerelease draft")
          if actual != expected:
              raise SystemExit(f"Unexpected release asset set: {sorted(actual)}")
          PY
