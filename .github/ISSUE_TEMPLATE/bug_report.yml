name: Bug report
description: Report reproducible incorrect behavior or a failed conversion
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, internal addresses, proprietary rules, and sensitive resource names before submitting.

  - type: input
    id: version
    attributes:
      label: Converter version
      placeholder: "4.0.0"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Source dialect
      options:
        - Snort 2
        - Snort 3
        - Suricata
        - Automatic inference
    validations:
      required: true

  - type: dropdown
    id: target
    attributes:
      label: Target
      options:
        - Snort 2
        - Snort 3
        - Suricata
        - JSON
        - Panorama preflight
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the exact command and a minimal original rule when safe.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and diagnostics
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I removed sensitive and proprietary information.
          required: true
        - label: This is not a security vulnerability.
          required: true
